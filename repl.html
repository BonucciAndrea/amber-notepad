<!DOCTYPE html>
<html lang="en" data-theme="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amber · REPL</title>
<style>
  :root{
    --bg:#0a0705;--bg2:#140f0a;--panel:#1b130c;--fg:#f5e6d0;--muted:#b79b78;
    --accent:#ffb000;--accent2:#ff7a18;--border:#3a2a18;--glow:255,176,0;
    --mono:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  html[data-theme="midnight"]{--bg:#080b16;--bg2:#0d1220;--panel:#111a2e;--fg:#dce4f5;--muted:#8394b8;--accent:#5aa9ff;--accent2:#8b5cf6;--border:#22304d;--glow:90,169,255;}
  html[data-theme="matrix"]{--bg:#020602;--bg2:#061006;--panel:#0a1a0a;--fg:#c8f7c8;--muted:#5fa15f;--accent:#39ff14;--accent2:#00b34a;--border:#123d12;--glow:57,255,20;}
  html[data-theme="paper"]{--bg:#f4efe4;--bg2:#ece5d5;--panel:#fbf8f1;--fg:#2a2420;--muted:#7a6f5f;--accent:#b5540a;--accent2:#d97706;--border:#d8ccb6;--glow:181,84,10;}
  html[data-theme="synthwave"]{--bg:#150826;--bg2:#1e0d38;--panel:#271046;--fg:#f0d6ff;--muted:#b189d6;--accent:#ff2fb9;--accent2:#22d3ee;--border:#3d1c66;--glow:255,47,185;}
  html[data-theme="mono"]{--bg:#0e0e10;--bg2:#151518;--panel:#1b1b1f;--fg:#e8e8ea;--muted:#9a9aa2;--accent:#eaeaea;--accent2:#9a9aa2;--border:#2c2c33;--glow:220,220,220;}

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex:none}
  .brand{font-family:var(--mono);font-weight:700;color:var(--fg)}
  .brand b{color:var(--accent)}
  header a.home{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  select,button{font-family:var(--sans);font-size:13px;color:var(--fg);background:var(--panel);
    border:1px solid var(--border);border-radius:8px;padding:7px 11px;cursor:pointer;transition:border-color .12s,background .12s}
  select:hover,button:hover{border-color:var(--accent)}
  button.accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#111;border:0;font-weight:600}
  .themes{display:flex;gap:6px}
  .sw{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0}
  .sw.active{border-color:var(--fg)}

  #term{flex:1;overflow-y:auto;padding:16px 18px;font-family:var(--mono);font-size:13.5px;line-height:1.34;
    cursor:text;background:
      radial-gradient(900px 500px at 90% -10%, rgba(var(--glow),.05), transparent 60%);}
  #log{white-space:pre-wrap;word-break:break-word}
  .prompt{color:var(--accent);font-weight:600}
  .userline{color:var(--fg)}
  .sys{color:var(--muted)}
  .inputrow{display:flex;align-items:baseline}
  .inputrow .prompt{flex:none;margin-right:2px}
  #in{flex:1;background:transparent;border:0;outline:0;color:var(--fg);font-family:var(--mono);
    font-size:13.5px;line-height:1.34;caret-color:var(--accent)}
  #boot{color:var(--muted);padding:4px 0}
  ::selection{background:rgba(var(--glow),.3)}
  /* scrollbar */
  #term::-webkit-scrollbar{width:10px}
  #term::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
</style>
</head>
<body>
<header>
  <div class="brand"><b>◆</b> amber <span class="sys" style="font-weight:400">· repl</span></div>
  <a class="home" href="index.html">← home</a>
  <div class="spacer"></div>
  <select id="examples"><option value="">Load example…</option></select>
  <button id="clear">Clear</button>
  <button id="reset">Reset session</button>
  <div class="themes" id="themes"></div>
</header>

<div id="term"><div id="boot">booting the Amber engine…</div><div id="log"></div>
  <div class="inputrow" id="row" style="display:none"><span class="prompt">amber&gt;&nbsp;</span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
</div>

<script src="amber.wasm.js"></script>
<script src="amber.js"></script>
<script>
  // ---- theme ---------------------------------------------------------------
  const THEMES=[["amber","#ffb000"],["midnight","#5aa9ff"],["matrix","#39ff14"],["paper","#d97706"],["synthwave","#ff2fb9"],["mono","#e6e6e6"]];
  const tbox=document.getElementById("themes");
  function setTheme(t){document.documentElement.setAttribute("data-theme",t);
    try{localStorage.setItem("amber-theme",t)}catch(e){}
    tbox.querySelectorAll(".sw").forEach(s=>s.classList.toggle("active",s.dataset.t===t));}
  THEMES.forEach(([t,c])=>{const b=document.createElement("button");b.className="sw";b.dataset.t=t;b.style.background=c;b.title=t;b.onclick=()=>setTheme(t);tbox.appendChild(b);});
  let saved="amber";try{saved=localStorage.getItem("amber-theme")||"amber"}catch(e){}
  setTheme(saved);

  // ---- terminal ------------------------------------------------------------
  const term=document.getElementById("term"), log=document.getElementById("log"),
        row=document.getElementById("row"), input=document.getElementById("in"),
        boot=document.getElementById("boot");
  const hist=[]; let hi=0;
  function scroll(){ term.scrollTop=term.scrollHeight; }
  function append(html){ const d=document.createElement("div"); d.innerHTML=html; log.appendChild(d); }
  function echo(line){ append('<span class="prompt">amber&gt;&nbsp;</span><span class="userline">'+
      line.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span>'); }
  function out(ansi){ if(!ansi) return; const h=ansiToHtml(ansi.replace(/\n$/,"")); if(h.length) append(h); }
  function sys(msg){ append('<span class="sys">'+msg+'</span>'); }

  let vm=null, busy=false;
  async function bootVM(){
    boot.style.display="block"; row.style.display="none"; boot.textContent="booting the Amber engine…";
    vm=new AmberVM();
    try{ await vm.boot(); }catch(e){ boot.textContent="failed to start: "+e.message; return; }
    boot.style.display="none"; row.style.display="flex";
    log.innerHTML="";
    sys("Amber v1.7 — WebAssembly build · columnar time-series engine");
    sys("Type an expression and press Enter.  Try:  2+3*4    ·    !10    ·    plot 10*{sin x%6}'!120");
    sys("Or pick a program from “Load example…”.  Colours &amp; charts render live.");
    append("");
    scroll(); input.focus();
  }

  function runLine(line){
    echo(line);
    if(line.trim().length){ out(vm.eval(line)); }
    scroll();
  }

  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      const line=input.value; input.value="";
      if(line.trim().length){ hist.push(line); hi=hist.length; }
      runLine(line);
    } else if(e.key==="ArrowUp"){ if(hi>0){hi--; input.value=hist[hi]||""; e.preventDefault(); setTimeout(()=>input.setSelectionRange(9999,9999),0);} }
    else if(e.key==="ArrowDown"){ if(hi<hist.length){hi++; input.value=hist[hi]||"";} }
    else if(e.ctrlKey && (e.key==="l"||e.key==="L")){ log.innerHTML=""; e.preventDefault(); }
  });
  term.addEventListener("mousedown",e=>{ if(window.getSelection().isCollapsed && e.target.tagName!=="INPUT") setTimeout(()=>input.focus(),0); });

  // examples dropdown
  const sel=document.getElementById("examples");
  AMBER_EXAMPLES.forEach(([f,d])=>{ const o=document.createElement("option"); o.value=f; o.textContent=f+"  —  "+d; sel.appendChild(o); });
  sel.addEventListener("change",()=>{ const f=sel.value; sel.selectedIndex=0; if(!f||!vm) return;
    append('<span class="sys">/ ── loading '+f+' ──</span>');
    echo("\\l "+f);
    out(vm.load(f));
    scroll(); input.focus();
  });

  document.getElementById("clear").onclick=()=>{ log.innerHTML=""; input.focus(); };
  document.getElementById("reset").onclick=async()=>{ sys("… resetting session (fresh memory)…"); await bootVM(); };

  bootVM();
</script>
</body>
</html>
